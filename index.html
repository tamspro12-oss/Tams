        <h1>TAMS Pro - Travel Agency Management Software in Pakistan</h1>
        <p>TAMS Pro (https://tamspro.online) is cloud travel agency management software built for Pakistani airline ticketing, Umrah, and visa agencies. It unifies bookings, an integrated SAR-to-PKR Umrah Cost Calculator, travel queries and quotations, branded PDF invoices and payment vouchers, automated double-entry PKR client and vendor ledgers, Cash and Bank accounts, deadline notifications, and financial reports.</p>
        <h2>Core Modules</h2>
        <ul>
          <li><strong>Dashboard:</strong> Business overview of receivables, payables, bookings, and profit.</li>
          <li><strong>Bookings:</strong> Airline tickets, Umrah packages, hotel reservations, and transport bookings.</li>
          <li><strong>Visas:</strong> Visa applications, processing status, and expiry reminders.</li>
          <li><strong>Vouchers:</strong> Umrah vouchers, hotel vouchers, ticket confirmations, and payment receipts (CRV/CPV).</li>
          <li><strong>Parties (Clients &amp; Vendors):</strong> Automated PKR double-entry ledgers for passengers, sub-agents, and consolidator suppliers.</li>
          <li><strong>Expenses &amp; Banks:</strong> Daily operating expenses linked directly to Cash and registered Pakistani bank accounts.</li>
          <li><strong>Queries &amp; Quotations:</strong> Track travel inquiries and convert branded PDF quotations into bookings in one click.</li>
          <li><strong>Umrah Cost Calculator:</strong> Price Makkah and Madinah hotel packages across Sharing, Quint, Quad, Triple, and Double rooms with live SAR-to-PKR exchange conversion.</li>
          <li><strong>PDF Invoices &amp; Agency Gmail:</strong> Issue sequential branded PDF documents and email them directly from your agency's connected Gmail address.</li>
        </ul>
