    <!-- Premium Splash Screen -->
    <style>
      html, body { background-color: #ffffff; }
      body { margin: 0; }
      #tams-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: #ffffff;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }
      #tams-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #tams-splash .splash-logo {
        font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.75rem;
        color: #0A2540; letter-spacing: 0.05em;
      }
      #tams-splash .splash-sub {
        font-family: 'Inter', sans-serif; font-size: 0.75rem; color: rgba(10,37,64,0.55);
        margin-top: 6px; letter-spacing: 0.1em; text-transform: uppercase;
      }
      #tams-splash .splash-bar {
        margin-top: 22px; width: 100px; height: 2px; border-radius: 2px;
        background: rgba(10,37,64,0.1); overflow: hidden;
      }
      #tams-splash .splash-bar-fill {
        width: 40%; height: 100%; border-radius: 2px;
        background: #00D4AA;
        animation: splashBar 1.1s ease-in-out infinite;
      }
      @keyframes splashBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>

  <body>
    <div id="tams-splash">
      <div class="splash-logo">TAMS Pro</div>
      <div class="splash-sub">Travel Agency Management</div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    </div>

    <script>
      (function() {
        var dismiss = function() {
          var s = document.getElementById('tams-splash');
          if (s) {
            s.style.transition = 'opacity 0.3s ease';
            s.style.opacity = '0';
            setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 300);
          }
        };
        // Auto-dismiss failsafe: guaranteed removal after 3.5s max
        setTimeout(dismiss, 3500);
        window.addEventListener('error', dismiss);
        window.addEventListener('unhandledrejection', dismiss);
      })();
    </script>
